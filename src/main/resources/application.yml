spring:
  application:
    name: yscord
  datasource:
    # No defaults on purpose: a missing env var must fail fast, never silently
    # connect with a weak baked-in credential. Local dev values live in the `dev`
    # profile (application-dev.yml); Docker/prod supply these via the environment.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  # Optional Google login (see de.yscord.auth.SecurityConfig). Credentials come
  # from the environment, in Kubernetes from the secret store.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            # Must equal, character for character, a redirect URI registered for
            # the client in Google's console. Spring would derive it from the
            # request, but behind Cloudflare → Envoy the app only sees http.
            redirect-uri: ${app.public-url}/login/oauth2/code/{registrationId}
  session:
    jdbc:
      # Tables come from our migrations (005), not from Spring.
      initialize-schema: never

# Schema is owned by MigrationRunner (see de.yscord.player.db). on-startup | only | off;
# in Kubernetes a Job migrates (`migrate` profile) and the app runs with `off`.
# Run with `--db.rollback=N` to revert the last N migrations (local only).
db:
  migrate: ${DB_MIGRATE:on-startup}

player:
  # Path to the yt-dlp binary (defaults to whatever is on PATH).
  yt-dlp-path: ${PLAYER_YTDLP_PATH:yt-dlp}
  # Where downloaded audio is cached (defaults to a temp subdir).
  cache-dir: ${PLAYER_CACHE_DIR:${java.io.tmpdir}/yscord-audio}

server:
  servlet:
    session:
      # Stay logged in for a month of inactivity (sessions live in Postgres).
      timeout: 30d
      cookie:
        secure: ${app.secure-cookies}

# Where browsers reach this app. Behind proxies the app can't see it itself.
app:
  public-url: ${APP_PUBLIC_URL}
  # Secure cookies whenever the public URL is https.
  secure-cookies: ${APP_SECURE_COOKIES:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
