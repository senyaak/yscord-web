# Local development profile — activated automatically by `./gradlew bootRun`.
# These are throwaway local credentials; production never uses this file and must
# get its datasource from the environment instead.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/yscord
    username: yscord
    password: yscord
  # Google login needs a real OAuth client with http://localhost:8080/... as a
  # redirect URI; without one the app starts and only the login fails.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
