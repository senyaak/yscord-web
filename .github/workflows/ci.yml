name: CI/CD

on:
  push:
    branches: [main]
    # A version tag is a release: promote that commit's image and deploy it.
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and assemble bootJar
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: todo-jar
          path: build/libs/*.jar

  docker:
    name: Build & push image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The gha build cache below needs the docker-container driver, not the
      # default docker driver — setup-buildx switches to it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build once, promote: the release reuses the image main already built and
  # tested for the tagged commit and gives it the version tag. Then it publishes
  # that commit's manifests, pinned to the version, to the deploy repo in ONE
  # commit. Argo CD only watches the deploy repo, so pushes to main never touch
  # the cluster: manifests and image ship together, or not at all.
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Two tags pushed at once must not interleave their deploy-repo commits.
    concurrency: release
    permissions:
      contents: read
      packages: write   # add the version tag to the image
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # The tagged commit itself: its manifests are what gets released.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No rebuild: copy the tag onto the exact image that was tested on main.
      # A tag pushed together with its commit gets here before main's image
      # build finishes, so wait for the image instead of failing.
      - name: Tag the image with the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="$IMAGE:sha-${GITHUB_SHA::7}"
          for attempt in $(seq 1 60); do
            docker buildx imagetools inspect "$SOURCE" > /dev/null 2>&1 && break
            [ "$attempt" = 60 ] && { echo "::error::$SOURCE still missing after 15 min; did the main build fail?"; exit 1; }
            echo "waiting for $SOURCE ($attempt/60)"
            sleep 15
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$SOURCE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A deploy key: write access to that one repo only (GITHUB_TOKEN can't
      # write to other repositories).
      - name: Check out the deploy repo
        uses: actions/checkout@v4
        with:
          repository: senyaak/yscord-deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_KEY }}
          path: deploy

      - name: Publish the manifests, pinned to the version
        run: |
          rm -rf deploy/yscord
          mkdir -p deploy/yscord/overlays
          cp -r k8s/base deploy/yscord/base
          cp -r k8s/overlays/release deploy/yscord/overlays/release
          (cd deploy/yscord/overlays/release && kustomize edit set image "yscord=$IMAGE:$VERSION")

      - name: Commit and push to the deploy repo
        working-directory: deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A yscord
          git commit -m "yscord $GITHUB_REF_NAME" -m "From $GITHUB_REPOSITORY@$GITHUB_SHA"
          git push
