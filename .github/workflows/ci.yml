name: CI/CD

on:
  push:
    branches: [main]
    # A version tag is a release: promote that commit's image and deploy it.
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and assemble bootJar
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: todo-jar
          path: build/libs/*.jar

  docker:
    name: Build & push image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The gha build cache below needs the docker-container driver, not the
      # default docker driver — setup-buildx switches to it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build once, promote: the release reuses the image main already built and
  # tested for the tagged commit, gives it the version tag, and points the
  # release overlay at it. Argo CD picks up that commit and rolls it out.
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # push the overlay bump to main
      packages: write   # add the version tag to the image
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No rebuild: copy the tag onto the exact image that was tested on main.
      - name: Tag the image with the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$SOURCE" > /dev/null \
            || { echo "::error::$SOURCE not found; wait for the main build to finish, then re-run"; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$SOURCE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Point the release overlay at the version
        working-directory: k8s/overlays/release
        run: kustomize edit set image "yscord=$IMAGE:$VERSION"

      # Pushes made with GITHUB_TOKEN never trigger workflows; [skip ci] just
      # makes that explicit in the history.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $GITHUB_REF_NAME [skip ci]"
          git push origin main
