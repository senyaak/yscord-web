# Argo CD Application: keeps the yscord namespace in sync with
# k8s/overlays/release on main. Argo pulls from git; nothing pushes into the
# cluster, so it works behind NAT.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yscord
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/senyaak/yscord-web.git
    targetRevision: main
    path: k8s/overlays/release
  destination:
    # The cluster Argo itself runs in.
    server: https://kubernetes.default.svc
    namespace: yscord
  syncPolicy:
    automated:
      # Delete resources that were removed from git (only ones Argo tracks).
      prune: true
      # Revert manual changes in the cluster back to what git says.
      selfHeal: true
