# The player: Spring Boot jar with the Angular SPA inside, one HTTP port.
apiVersion: v1
kind: Service
metadata:
  name: yscord
  labels:
    app: yscord
spec:
  # Regular ClusterIP: a stable virtual IP that load-balances over all ready pods.
  selector:
    app: yscord
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yscord
  labels:
    app: yscord
spec:
  # One replica for now: the session state is in-memory per pod (see stage 8).
  replicas: 1
  selector:
    matchLabels:
      app: yscord
  template:
    metadata:
      labels:
        app: yscord
    spec:
      containers:
        - name: yscord
          # Placeholder name; each overlay rewrites it to a concrete image + tag.
          image: yscord
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/yscord
            # Same Secret as Postgres itself, picked key by key.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PLAYER_CACHE_DIR
              value: /cache
          volumeMounts:
            - name: audio-cache
              mountPath: /cache
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            # Memory limit only: the JVM sizes its heap from it (MaxRAMPercentage
            # in the Dockerfile). No CPU limit on purpose — it throttles the JVM.
            limits:
              memory: 512Mi
          # Startup gate: the JVM + migrations take a while. Liveness and readiness
          # only start once this has passed, so a slow boot is never killed.
          # Poll every second (ready is noticed almost instantly) with a hard
          # deadline of 1s x 120 = 2 minutes; the first few "connection refused"
          # failures while the JVM boots are expected, not errors.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 1
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
      volumes:
        # Scratch space for downloaded audio; lives and dies with the pod.
        - name: audio-cache
          emptyDir:
            sizeLimit: 1Gi
